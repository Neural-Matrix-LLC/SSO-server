# DEV ONLY (mounted by docker-compose.dev.yml into /etc/nginx/sso.d/):
# serves examples/frontend at /demo/ (same origin as the SSO, so the SameSite=Lax cookie works over
# the self-signed TLS) and proxies the examples/verifier demo API at /verifier/.
location /demo/ {
    alias /usr/share/nginx/demo/;
    index index.html;
}
location /verifier/ {
    proxy_pass http://verifier:8001/;
}
