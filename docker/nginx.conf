# nginx for the SSO server (spec §9.5, deployment plan §3.3 / R25).
# This file is an nginx *template*: the official nginx image renders it with envsubst
# (mounted at /etc/nginx/templates/default.conf.template -> /etc/nginx/conf.d/default.conf).
# Only these env vars are substituted (everything else, e.g. $host, is nginx's own):
#   SSO_SERVER_NAME     public host name(s), e.g. "sso.example.com" (no default: set it in .env)
#   SSO_TLS_CERT_FILE   cert file name inside /etc/nginx/certs (mounted read-only)
#   SSO_TLS_KEY_FILE    key file name inside /etc/nginx/certs
#   SSO_HSTS_MAX_AGE    seconds (start low on staging, 31536000 in prod)

upstream sso_web {
    server web:8000;
    keepalive 16;
}

# Optional defence in depth; the authoritative limits are DRF's (uniform error shape).
limit_req_zone $binary_remote_addr zone=sso_login:10m rate=30r/m;

server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name ${SSO_SERVER_NAME};

    # ACME HTTP-01 challenge (certbot --webroot -w /var/www/acme)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    # container healthcheck (plain HTTP inside the container only)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SSO_SERVER_NAME};

    ssl_certificate     /etc/nginx/certs/${SSO_TLS_CERT_FILE};
    ssl_certificate_key /etc/nginx/certs/${SSO_TLS_KEY_FILE};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=${SSO_HSTS_MAX_AGE}; includeSubDomains" always;

    # The default "combined" access log has no headers/bodies. NEVER add $http_authorization,
    # $http_cookie or $request_body to a log format (spec §9.6). Phase 5: mask ?code= on /sso/*.
    access_log /var/log/nginx/access.log combined;

    client_max_body_size 64k;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite (not append) so clients cannot spoof their IP past the per-IP login throttle;
    # Django/DRF trust exactly one hop (NUM_PROXIES=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location = /api/v1/auth/login {
        limit_req zone=sso_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sso_web;
    }

    # Django sends Cache-Control for JWKS/discovery itself; nginx adds nothing.
    location / {
        proxy_pass http://sso_web;
    }

    # Admin IP allow-list (optional, open question): add a location for the SSO_ADMIN_PATH value, e.g.
    #   location /sso-admin/ { allow 203.0.113.0/24; deny all; proxy_pass http://sso_web; }

    # Extra locations (dev overlay mounts the demo page + verifier proxy here). Empty in prod.
    include /etc/nginx/sso.d/*.conf;
}
