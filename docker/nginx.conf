# nginx for the SSO server (spec §9.5, deployment plan §3.3 / R25).
# This file is an nginx *template*: the official nginx image renders it with envsubst at start-up
# (mounted at /etc/nginx/templates/default.conf.template -> /etc/nginx/conf.d/default.conf).
# NGINX_ENVSUBST_FILTER=^SSO_ limits substitution to these variables, so nginx's own $host etc. stay as-is:
#   SSO_HOSTNAME       public FQDN of the SSO server (required, no default)
#   SSO_HTTPS_PORT     public HTTPS port (the redirect includes it unless it is 443)
#   SSO_ADMIN_PATH     admin URL prefix, e.g. "sso-admin/" (no leading slash)
#   SSO_TLS_CERT_FILE  cert file name inside /etc/nginx/certs (mounted read-only)
#   SSO_TLS_KEY_FILE   key file name inside /etc/nginx/certs
# HSTS is sent by Django (SSO_HSTS_SECONDS), deliberately not duplicated here.

upstream sso_web {
    server web:8000;
    keepalive 16;
}

# ":<port>" when the public HTTPS port is not 443, else "" (used by the :80 redirect)
map "${SSO_HTTPS_PORT}" $sso_https_port_suffix {
    "443"   "";
    default ":${SSO_HTTPS_PORT}";
}

# Optional defence in depth; the authoritative limits are DRF's (uniform error shape, Retry-After).
limit_req_zone $binary_remote_addr zone=sso_login:10m rate=30r/m;

server_tokens off;

# ---- unknown Host -> drop (444). Also hosts the container healthcheck.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 444;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # no certificate is presented for unknown SNI names
    return 444;
}

# ---- :80 for the SSO host: ACME challenge, everything else -> https (with the port if not 443)
server {
    listen 80;
    listen [::]:80;
    server_name ${SSO_HOSTNAME};

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://${SSO_HOSTNAME}$sso_https_port_suffix$request_uri;
    }
}

# ---- :443 the SSO itself
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SSO_HOSTNAME};

    ssl_certificate     /etc/nginx/certs/${SSO_TLS_CERT_FILE};
    ssl_certificate_key /etc/nginx/certs/${SSO_TLS_KEY_FILE};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Default "combined" format: no headers or bodies. NEVER add $http_authorization, $http_cookie
    # or $request_body to a log format (spec §9.6). Phase 5: mask ?code= on /sso/* as well.
    access_log /var/log/nginx/access.log combined;

    client_max_body_size 64k;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite (not append) so clients cannot spoof their IP past the per-IP login throttle;
    # Django/DRF trust exactly one hop (SSO_NUM_PROXIES=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location = /api/v1/auth/login {
        limit_req zone=sso_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sso_web;
    }

    # Admin. Optional IP allow-list (deployment plan Q12): drop a file such as
    #   allow 203.0.113.0/24;  deny all;
    # into the mounted /etc/nginx/sso-admin.d/ directory.
    location /${SSO_ADMIN_PATH} {
        include /etc/nginx/sso-admin.d/*.conf;
        proxy_pass http://sso_web;
    }

    # Django sets Cache-Control on /.well-known/jwks.json itself; nginx adds nothing.
    location / {
        proxy_pass http://sso_web;
    }

    # Extra locations (the dev overlay mounts the demo page + verifier proxy here). Empty in prod.
    include /etc/nginx/sso.d/*.conf;
}
