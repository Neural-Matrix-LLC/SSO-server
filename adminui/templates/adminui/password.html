{% extends "adminui/base.html" %}{% block title %}Set password{% endblock %}
{% block content %}
<h1>Set password for {{ u.username }}</h1>
<p>All tokens and sessions of {{ u.username }} end.</p>
<form method="post" class="narrow">{% csrf_token %}<input type="hidden" name="back" value="{{ ui }}users/{{ u.pk }}/password">
  <label for="p1">New password</label><input id="p1" name="password" type="password" autocomplete="new-password" required>
  <label for="p2">Repeat</label><input id="p2" name="password2" type="password" autocomplete="new-password" required>
  <button type="submit" class="danger">Set password</button> <a href="{{ ui }}users/{{ u.pk }}/">Cancel</a>
</form>
{% endblock %}
