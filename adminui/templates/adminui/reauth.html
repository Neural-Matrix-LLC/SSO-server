{% extends "adminui/base.html" %}{% block title %}Confirm password{% endblock %}
{% block content %}
<h1>Confirm your password</h1>
<p>This action changes access or deletes data. Confirm your password to continue; you stay elevated for a few minutes.</p>
<form method="post" class="narrow">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="id_password">Password</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required autofocus{% if error %} aria-describedby="form-error"{% endif %}>
  <button type="submit">Confirm</button> <a href="{{ ui }}">Cancel</a>
</form>
{% endblock %}
