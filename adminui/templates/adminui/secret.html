{% extends "adminui/base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p class="warn" role="alert">Copy the {{ label }} now. It is shown <strong>once</strong> and cannot be displayed again.</p>
<dl class="kv"><dt>client_id</dt><dd><code>{{ client_id }}</code></dd>
<dt>{{ label }}</dt><dd><code id="secret">{{ secret }}</code> <button type="button" class="copy" data-copy="secret">Copy</button></dd></dl>
<p><a href="{{ back }}">Done</a></p>
{% endblock %}
