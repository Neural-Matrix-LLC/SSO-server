{% extends "adminui/base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<h1>SSO admin sign in</h1>
{% if note %}<p class="note" role="status">{{ note }}</p>{% endif %}
<form method="post" class="narrow">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="id_username">Username or email</label>
  <input id="id_username" name="username" autocomplete="username" required value="{{ username|default:'' }}"{% if error %} aria-describedby="form-error"{% endif %}>
  <label for="id_password">Password</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
<p class="muted">Admins need an active staff account with application.sso_admin (or superuser).</p>
{% endblock %}
