[pytest]
testpaths = .
pythonpath = .
addopts = -ra
markers =
    needs_private_key: needs SSO_TEST_PRIVATE_KEY_PATH (test env signing key) to mint validly-signed bad-claim tokens
    needs_manage: needs SSO_MANAGE_CMD to inspect/modify DB state through the server's Django shell
    needs_verifier: needs VERIFIER_BASE_URL (examples/verifier FastAPI demo running)
    throttle: rate-limit tests; slow (waits for throttle windows); run last or alone with -m throttle
    static: inspects repo files (deployment deliverables), no server needed
    slow: takes more than a few seconds
